name: Refresh test & build cache & build latest
on:
  workflow_call:
    inputs:
      release_debug:
        description: 'Build debug images'
        required: false
        type: boolean
        default: false

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cache-refresh:
    name: Build test cache and push images
    permissions:
      contents: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    # Pins the OIDC token subject to
    # repo:cilium/proxy:environment:release-base-images, which is the identity
    # federated with the Quay robot account.
    environment:
      name: release-base-images
      deployment: false
    timeout-minutes: 360
    runs-on: ${{ vars.PROXY_BUILD_GITHUB_RUNNER }}
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt:qemu-v7.0.0-28

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Prep for build
      run: |
        echo "${{ github.sha }}" >SOURCE_VERSION
        echo "ENVOY_MINOR_RELEASE=$(cat ENVOY_VERSION | sed 's/envoy-\([0-9]\+\.[0-9]\+\)\..*/v\1/')" >> $GITHUB_ENV
        echo "ENVOY_PATCH_RELEASE=$(cat ENVOY_VERSION | sed 's/^envoy-\([0-9]\+\.[0-9]\+\.[0-9]\+$\)/v\1/')" >> $GITHUB_ENV
        echo "BUILDER_DOCKER_HASH=$(git ls-tree --full-tree HEAD -- ./Dockerfile.builder | awk '{ print $3 }')" >> $GITHUB_ENV

    - name: Cache Docker layers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/buildx-cache
        key: docker-cache-tests

    - name: Clear cache
      run: rm -rf /tmp/buildx-cache/*

    - name: Wait for builder image
      uses: ./.github/workflows/wait-for-image
      with:
        SHA: ${{ env.BUILDER_DOCKER_HASH }}
        repo: cilium
        images: cilium-envoy-builder

    - name: Run integration tests on amd64 & build of test artifact archive
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: docker_tests_ci_cache_update
      with:
        provenance: false
        context: .
        file: ./Dockerfile.tests
        target: builder-archive
        platforms: linux/amd64
        build-args: |
          BUILDER_BASE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ env.BUILDER_DOCKER_HASH }}
          ARCHIVE_IMAGE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:test-${{ github.ref_name }}-archive-latest
          COPY_CACHE_EXT=.new
          BAZEL_BUILD_OPTS=--remote_upload_local_results=false
          BAZEL_TEST_OPTS=--test_timeout=300 --local_test_jobs=1 --flaky_test_attempts=3
        cache-to: type=local,dest=/tmp/buildx-cache,mode=max
        push: false
        tags: quay.io/${{ github.repository_owner }}/cilium-envoy-builder:test-${{ github.ref_name }}-archive-latest
        outputs: type=oci,dest=${{ runner.temp }}/test-archive.tar

    # Quay's registry endpoint only accepts credentials or a JWT signed by
    # Quay itself, so the GitHub OIDC token cannot be used as the registry
    # password directly. Trade it for a short lived robot token first.
    #
    # Because the job references an environment, the subject of the token is
    # repo:cilium@21054566/proxy@155294575:environment:release-base-images, the
    # immutable form that carries the owner and repository ids. That is the
    # identity federated with the robot account on the Quay side, so renaming
    # the environment breaks the login.
    #
    # Quay gives the token one hour and the build above takes hours, so this
    # step mints the token once the build finishes.
    - name: Get a quay.io robot token via OIDC for the test artifact archive
      id: token-test-archive
      env:
        ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
      run: |
        oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
          | jq -er '.value')"
        echo "::add-mask::${oidc_token}"

        # Pass the credentials on stdin so that the OIDC token is not visible
        # in the process list of the runner.
        robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
          | curl -sSf --retry 3 --retry-all-errors -K - \
            "https://quay.io/oauth2/federation/robot/token" \
          | jq -er '.token')"
        echo "::add-mask::${robot_token}"

        echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

    - name: Login to quay.io for the test artifact archive
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: quay.io
        username: ${{ vars.QUAY_ROBOT_RELEASE }}
        password: ${{ steps.token-test-archive.outputs.token }}

    - name: Push of test artifact archive
      run: |
        skopeo copy --multi-arch all \
          "oci-archive:${{ runner.temp }}/test-archive.tar" \
          docker://quay.io/${{ github.repository_owner }}/cilium-envoy-builder:test-${{ github.ref_name }}-archive-latest
        rm -f "${{ runner.temp }}/test-archive.tar"

  build-cache-and-push-images:
    name: Build cache and push images
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange and keyless cosign signing.
      id-token: write
    # Pins the OIDC token subject to
    # repo:cilium/proxy:environment:release-base-images, which is the identity
    # federated with the Quay robot account.
    environment:
      name: release-base-images
      deployment: false
    timeout-minutes: 360
    runs-on: ${{ vars.PROXY_BUILD_GITHUB_RUNNER }}
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt:qemu-v7.0.0-28
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Prep for build
      run: |
        echo "${{ github.sha }}" >SOURCE_VERSION
        echo "ENVOY_MINOR_RELEASE=$(cat ENVOY_VERSION | sed 's/envoy-\([0-9]\+\.[0-9]\+\)\..*/v\1/')" >> $GITHUB_ENV
        echo "ENVOY_PATCH_RELEASE=$(cat ENVOY_VERSION | sed 's/^envoy-\([0-9]\+\.[0-9]\+\.[0-9]\+$\)/v\1/')" >> $GITHUB_ENV
        echo "BUILDER_DOCKER_HASH=$(git ls-tree --full-tree HEAD -- ./Dockerfile.builder | awk '{ print $3 }')" >> $GITHUB_ENV
        echo "SOURCE_TIMESTAMP=$(git log -1 --pretty=format:"%ct" .)" >> $GITHUB_ENV

    - name: Checking if cilium-envoy-builder image exists
      id: cilium-builder-tag-in-repositories
      shell: bash
      run: |
        if docker buildx imagetools inspect quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ env.BUILDER_DOCKER_HASH }} &>/dev/null; then
          echo exists="true" >> $GITHUB_OUTPUT
        else
          echo exists="false" >> $GITHUB_OUTPUT
        fi

    - name: Multi-arch build of Builder image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: steps.cilium-builder-tag-in-repositories.outputs.exists == 'false'
      id: docker_build_builder
      with:
        provenance: false
        context: .
        file: ./Dockerfile.builder
        platforms: linux/amd64,linux/arm64
        push: false
        tags: quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ env.BUILDER_DOCKER_HASH }}
        outputs: type=oci,dest=${{ runner.temp }}/builder.tar

    # Quay's registry endpoint only accepts credentials or a JWT signed by
    # Quay itself, so the GitHub OIDC token cannot be used as the registry
    # password directly. Trade it for a short lived robot token first.
    #
    # Because the job references an environment, the subject of the token is
    # repo:cilium@21054566/proxy@155294575:environment:release-base-images, the
    # immutable form that carries the owner and repository ids. That is the
    # identity federated with the robot account on the Quay side, so renaming
    # the environment breaks the login.
    #
    # Quay gives the token one hour and the builds below take hours, so every
    # artifact gets its own token once its build finishes. Nothing before the
    # first push needs Quay auth: the builder tag lookup and the BUILDER_BASE
    # and ARCHIVE_IMAGE pulls all read public repositories.
    - name: Get a quay.io robot token via OIDC for the Builder image
      id: token-builder
      if: steps.cilium-builder-tag-in-repositories.outputs.exists == 'false'
      env:
        ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
      run: |
        oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
          | jq -er '.value')"
        echo "::add-mask::${oidc_token}"

        # Pass the credentials on stdin so that the OIDC token is not visible
        # in the process list of the runner.
        robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
          | curl -sSf --retry 3 --retry-all-errors -K - \
            "https://quay.io/oauth2/federation/robot/token" \
          | jq -er '.token')"
        echo "::add-mask::${robot_token}"

        echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

    - name: Login to quay.io for the Builder image
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: steps.cilium-builder-tag-in-repositories.outputs.exists == 'false'
      with:
        registry: quay.io
        username: ${{ vars.QUAY_ROBOT_RELEASE }}
        password: ${{ steps.token-builder.outputs.token }}

    - name: Push of Builder image
      if: steps.cilium-builder-tag-in-repositories.outputs.exists == 'false'
      run: |
        for tag in ${{ env.BUILDER_DOCKER_HASH }} latest; do
          skopeo copy --multi-arch all \
            "oci-archive:${{ runner.temp }}/builder.tar" \
            "docker://quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${tag}"
        done
        rm -f "${{ runner.temp }}/builder.tar"

    - name: Multi-arch build of build artifact archive
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        target: builder-archive
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILDER_BASE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ env.BUILDER_DOCKER_HASH }}
          ARCHIVE_IMAGE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ github.ref_name }}-archive-latest
          COPY_CACHE_EXT=.new
          BAZEL_BUILD_OPTS="--jobs=HOST_CPUS*.75"
        push: false
        tags: quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ github.ref_name }}-archive-latest
        outputs: type=oci,dest=${{ runner.temp }}/archive.tar

    # A token of its own for this push; see the token exchange above.
    - name: Get a quay.io robot token via OIDC for the build artifact archive
      id: token-archive
      env:
        ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
      run: |
        oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
          | jq -er '.value')"
        echo "::add-mask::${oidc_token}"

        # Pass the credentials on stdin so that the OIDC token is not visible
        # in the process list of the runner.
        robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
          | curl -sSf --retry 3 --retry-all-errors -K - \
            "https://quay.io/oauth2/federation/robot/token" \
          | jq -er '.token')"
        echo "::add-mask::${robot_token}"

        echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

    - name: Login to quay.io for the build artifact archive
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: quay.io
        username: ${{ vars.QUAY_ROBOT_RELEASE }}
        password: ${{ steps.token-archive.outputs.token }}

    - name: Push of build artifact archive
      run: |
        skopeo copy --multi-arch all \
          "oci-archive:${{ runner.temp }}/archive.tar" \
          docker://quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ github.ref_name }}-archive-latest
        rm -f "${{ runner.temp }}/archive.tar"

    - name: Cache Docker layers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/buildx-cache
        key: docker-cache-main

    - name: Clear cache
      run: |
        rm -rf /tmp/buildx-cache/*
        docker buildx prune -f

    - name: Multi-arch build main latest
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: docker_build_cd
      with:
        provenance: false
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILDER_BASE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ env.BUILDER_DOCKER_HASH }}
          BAZEL_BUILD_OPTS=--remote_upload_local_results=false
          ARCHIVE_IMAGE=quay.io/${{ github.repository_owner }}/cilium-envoy-builder:${{ github.ref_name }}-archive-latest
          RELEASE_DEBUG=${{ inputs.release_debug && '1' || '' }}
        cache-to: type=local,dest=/tmp/buildx-cache,mode=max
        push: false
        tags: quay.io/${{ github.repository_owner }}/cilium-envoy:${{ github.sha }}
        outputs: type=oci,dest=${{ runner.temp }}/main.tar

    # A token of its own for this push; see the token exchange above. The
    # cosign and SBOM steps at the end of the job write to quay.io with it too.
    - name: Get a quay.io robot token via OIDC for main latest
      id: token-main
      env:
        ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
      run: |
        oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
          | jq -er '.value')"
        echo "::add-mask::${oidc_token}"

        # Pass the credentials on stdin so that the OIDC token is not visible
        # in the process list of the runner.
        robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
          | curl -sSf --retry 3 --retry-all-errors -K - \
            "https://quay.io/oauth2/federation/robot/token" \
          | jq -er '.token')"
        echo "::add-mask::${robot_token}"

        echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

    - name: Login to quay.io for main latest
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: quay.io
        username: ${{ vars.QUAY_ROBOT_RELEASE }}
        password: ${{ steps.token-main.outputs.token }}

    - name: Push of main latest
      run: |
        for tag in \
          latest \
          ${{ github.sha }} \
          ${{ env.ENVOY_MINOR_RELEASE }}-${{ github.sha }} \
          ${{ env.ENVOY_PATCH_RELEASE }}-${{ github.sha }} \
          ${{ env.ENVOY_PATCH_RELEASE }}-${{ env.SOURCE_TIMESTAMP }}-${{ github.sha }}; do
          skopeo copy --multi-arch all \
            "oci-archive:${{ runner.temp }}/main.tar" \
            "docker://quay.io/${{ github.repository_owner }}/cilium-envoy:${tag}"
        done
        rm -f "${{ runner.temp }}/main.tar"

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign Container Image
      run: |
        cosign sign -y quay.io/${{ github.repository_owner }}/cilium-envoy@${{ steps.docker_build_cd.outputs.digest }}

    - name: Install Bom
      shell: bash
      env:
        # renovate: datasource=github-releases depName=kubernetes-sigs/bom
        BOM_VERSION: v0.7.1
      run: |
        curl -L https://github.com/kubernetes-sigs/bom/releases/download/${{ env.BOM_VERSION }}/bom-amd64-linux -o bom
        sudo mv ./bom /usr/local/bin/bom
        sudo chmod +x /usr/local/bin/bom

    - name: Generate SBOM
      shell: bash
      run: |
        bom generate -o sbom_cilium-envoy_${{ github.sha }}.spdx --format=json --image=quay.io/${{ github.repository_owner }}/cilium-envoy:${{ github.sha }}

    - name: Attach SBOM to container images
      run: |
        cosign attach sbom --sbom sbom_cilium-envoy_${{ github.sha }}.spdx quay.io/${{ github.repository_owner }}/cilium-envoy@${{ steps.docker_build_cd.outputs.digest }}

    - name: Sign SBOM Image
      run: |
        docker_build_cd_digest="${{ steps.docker_build_cd.outputs.digest }}"
        image_name="quay.io/${{ github.repository_owner }}/cilium-envoy:${docker_build_cd_digest/:/-}.sbom"
        docker_build_cd_sbom_digest="sha256:$(docker buildx imagetools inspect --raw ${image_name} | sha256sum | head -c 64)"
        cosign sign -y "quay.io/${{ github.repository_owner }}/cilium-envoy@${docker_build_cd_sbom_digest}"

    - name: Envoy binary version check
      shell: bash
      run: |
        envoy_version=$(docker run --rm quay.io/${{ github.repository_owner }}/cilium-envoy:${{ github.sha }} cilium-envoy --version)
        expected_version=$(echo ${{ env.ENVOY_PATCH_RELEASE }} | sed 's/^v//')
        echo ${envoy_version}
        [[ "${envoy_version}" == *"${{ github.sha }}/$expected_version"* ]]

    - name: Release Image Digest
      shell: bash
      run: |
        echo "Digests:"
        echo "quay.io/${{ github.repository_owner }}/cilium-envoy:${{ github.sha }}@${{ steps.docker_build_cd.outputs.digest }}"
        echo "quay.io/${{ github.repository_owner }}/cilium-envoy:${{ env.ENVOY_MINOR_RELEASE }}-${{ github.sha }}@${{ steps.docker_build_cd.outputs.digest }}"
        echo "quay.io/${{ github.repository_owner }}/cilium-envoy:${{ env.ENVOY_PATCH_RELEASE }}-${{ github.sha }}@${{ steps.docker_build_cd.outputs.digest }}"
        echo "quay.io/${{ github.repository_owner }}/cilium-envoy:${{ env.ENVOY_PATCH_RELEASE }}-${{ env.SOURCE_TIMESTAMP }}-${{ github.sha }}@${{ steps.docker_build_cd.outputs.digest }}"
