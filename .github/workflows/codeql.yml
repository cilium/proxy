name: CodeQL

on: 
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.config.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - runner: ubuntu-24.04
            language: 'actions'
          - runner: ubuntu-24.04
            language: 'go'
          - runner: ${{ vars.PROXY_BUILD_GITHUB_RUNNER }}
            language: 'cpp'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.config.language }}

      - name: Install deps (for C++)
        if: matrix.config.language == 'cpp'
        shell: bash
        run: |
          sudo apt-get update --error-on=any
          # Same build dependencies as Dockerfile.builder
          sudo apt-get install --yes \
          autoconf automake cmake coreutils curl git libtool make ninja-build patch patchelf libatomic1 \
          python3 python-is-python3 unzip virtualenv wget xz-utils zip
          tools/install_bazelisk.sh
          # Same clang install as Dockerfile.builder, version must match MIN_CLANG_VERSION in Makefile.
          # libtinfo5 is required by upstream clang and no longer available on Ubuntu 24.04.
          curl -sfL https://snapshot.ubuntu.com/ubuntu/20240501T120000Z/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb -o /tmp/libtinfo5.deb
          sudo dpkg -i /tmp/libtinfo5.deb
          curl -sfL https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -o /tmp/llvm.tar.xz
          sudo mkdir -p /usr/lib/llvm-18
          sudo tar -xJf /tmp/llvm.tar.xz -C /usr/lib/llvm-18 --strip-components=1
          rm -f /tmp/libtinfo5.deb /tmp/llvm.tar.xz
          for tool in clang clang++ clang-cpp lld ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-dwp llvm-cov llvm-config llvm-symbolizer; do
            sudo ln -sf /usr/lib/llvm-18/bin/$tool /usr/bin/$tool
          done
          clang --version

      - name: Build (for C++)
        if: matrix.config.language == 'cpp'
        run: |
          # PKG_BUILD=1 skips the clang install, as it is already done above
          make PKG_BUILD=1 clang.bazelrc
          bazel shutdown
          bazel build \
          -c fastbuild \
          --spawn_strategy=local \
          --discard_analysis_cache \
          --nouse_action_cache \
          --noshow_progress \
          --noshow_loading_progress \
          //:cilium-envoy

      - name: Autobuild
        if: matrix.config.language != 'cpp'
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: '/language:${{matrix.config.language}}'
          output: sarif-output-${{ matrix.config.language }}.sarif
      - name: Filter SARIF Results
        run: |
          REPO_URL="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/"
          jq --arg baseUrl "$REPO_URL" '[.runs[].results[] |
            {
              ruleId: .ruleId,
              message: .message.text,
              url: "\($baseUrl)\(.locations[0].physicalLocation.artifactLocation.uri)#L\(.locations[0].physicalLocation.region.startLine)\(if .locations[0].physicalLocation.region.endLine != null then "-L\(.locations[0].physicalLocation.region.endLine)" else "" end)"
            }]' sarif-output-${{ matrix.config.language }}.sarif/${{ matrix.config.language }}.sarif > filtered-${{ matrix.config.language }}.json
      - name: Display Filtered Results
        run: cat filtered-${{ matrix.config.language }}.json
      - name: Send Slack Notification
        env:
          SEC_BOT_SLACK_WEBHOOK: ${{ secrets.SEC_BOT_SLACK_WEBHOOK }}
          CHANNEL: "#security-team"
        run: |
          jq -c '.[]' filtered-${{ matrix.config.language }}.json | while read -r item; do
            RULE_ID=$(echo "$item" | jq -r '.ruleId')
            MESSAGE=$(echo "$item" | jq -r '.message')
            URL=$(echo "$item" | jq -r '.url')

            PAYLOAD=$(cat <<EOF
          {
            "channel": "$CHANNEL",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 CodeQL Alert for ${{ matrix.config.language }} 🚨",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Rule:* $RULE_ID"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Message:* $MESSAGE"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*File:* $URL"
                }
              }
            ]
          }
          EOF
            )

            curl -X POST -H "Authorization: Bearer $SEC_BOT_SLACK_WEBHOOK" \
                  -H "Content-type: application/json" \
                  --data-raw "$PAYLOAD" https://slack.com/api/chat.postMessage
          done
