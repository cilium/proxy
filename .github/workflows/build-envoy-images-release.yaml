name: Refresh test & build cache & build latest
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-envoy-images-release:
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange in the called workflow.
      id-token: write
    uses: ./.github/workflows/build-envoy-images-release-base.yaml
    with:
      release_debug: false
