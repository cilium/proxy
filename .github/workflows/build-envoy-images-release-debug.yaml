name: Refresh test & build cache & build latest wth debug symbols
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-envoy-images-release-debug:
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange in the called workflow.
      id-token: write
    uses: ./.github/workflows/build-envoy-images-release-base.yaml
    with:
      release_debug: true
